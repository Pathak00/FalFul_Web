<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2e1a"/>
      <stop offset="100%" stop-color="#2d4a1e"/>
    </linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Mango body -->
  <ellipse cx="16" cy="21" rx="8" ry="9" fill="url(#mg)"/>

  <!-- Orange blush on the right cheek of the mango -->
  <ellipse cx="20" cy="18" rx="5" ry="6" fill="url(#blush)"/>

  <!-- Highlight (top-left gloss) -->
  <ellipse cx="12" cy="17" rx="2" ry="3"
           fill="white" opacity="0.22"
           transform="rotate(-25 12 17)"/>

  <!-- Stem -->
  <path d="M16 12 Q15.5 9 16 7" stroke="#6b4c11" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>

  <!-- Leaf -->
  <path d="M16 8 C18.5 5.5 23 6 21.5 10.5 C19.5 8.5 17.5 7.5 16 8Z"
        fill="#4ade80"/>
  <path d="M16 8 C19 8.5 21 10 21.5 10.5"
        stroke="#22c55e" stroke-width="0.7" fill="none" opacity="0.7"/>
</svg>
