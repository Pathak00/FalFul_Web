<div class="auth-card org-card">
  <a routerLink="/" class="back-home"><i class="bi bi-arrow-left"></i> Back to Home</a>
  <h2>Register Organization</h2>
  <p class="subtitle">Set up your business account on FalFul</p>

  @if (errorMessage()) {
    <div class="alert alert-error">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="section-label">Owner Details</div>

    <div class="form-row">
      <div class="form-group">
        <label>Owner Full Name *</label>
        <input type="text" formControlName="ownerFullName" placeholder="Full name" />
      </div>
      <div class="form-group">
        <label>Owner Phone *</label>
        <input type="tel" formControlName="ownerPhone" placeholder="+977XXXXXXXXXX" />
      </div>
    </div>

    <div class="form-group">
      <label>Owner Email *</label>
      <input type="email" formControlName="ownerEmail" placeholder="owner@company.com" />
    </div>

    <div class="form-group">
      <label>Password *</label>
      <input type="password" formControlName="password" placeholder="Minimum 8 characters" />
    </div>

    <div class="section-label">Organization Details</div>

    <div class="form-row">
      <div class="form-group">
        <label>Organization Name *</label>
        <input type="text" formControlName="organizationName" placeholder="Your organization name" />
      </div>
      <div class="form-group">
        <label>Type *</label>
        <select formControlName="organizationType">
          <option value="" disabled>Select type</option>
          @for (type of orgTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="organizationDescription" rows="2" placeholder="Brief description of your organization"></textarea>
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" formControlName="address" placeholder="Organization address" />
    </div>

    <button type="submit" class="btn-submit" [disabled]="form.invalid || isLoading()">
      @if (isLoading()) { <span class="spinner"></span> Registering... }
      @else { Register Organization }
    </button>
  </form>

  <p class="auth-link">
    Individual user? <a routerLink="/auth/register">Register here</a>
  </p>
  <p class="auth-link">
    Already have an account? <a routerLink="/auth/login">Sign in</a>
  </p>
</div>
