<section class="stats-section">
  <div class="container">
    @if (sectionData?.title || sectionData?.subtitle) {
    <div class="stats-head text-center">

      @if (sectionData?.title) { <h2 class="section-title">{{ sectionData!.title }}</h2> }
      @if (sectionData?.subtitle) { <p class="section-sub">{{ sectionData!.subtitle }}</p> }
    </div>
    }
    <div class="stats-grid">
      @for (s of stats; track s.label; let i = $index) {
      <div class="stat-item">
        <span class="stat-icon">{{ s.icon }}</span>
        <span class="stat-value">{{ displayValues[i] }}</span>
        <span class="stat-label">{{ s.label }}</span>
      </div>
      }
    </div>
  </div>
</section>
