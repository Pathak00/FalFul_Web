@if (visible()) {
  <div class="cursor-outer"
       [ngStyle]="{ transform: 'translate(' + outerX() + 'px, ' + outerY() + 'px)', width: hovered() ? '56px' : '40px', height: hovered() ? '56px' : '40px' }">
  </div>
  <div class="cursor-dot"
       [ngStyle]="{ transform: 'translate(' + dotX() + 'px, ' + dotY() + 'px)' }">
  </div>
}
