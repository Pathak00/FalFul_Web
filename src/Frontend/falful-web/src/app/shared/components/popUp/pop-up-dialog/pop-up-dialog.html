<div class="dialog-overlay">

    <div class="dialog-box">

        <h3>{{ title }}</h3>

        <!-- <p>{{ message }}</p> -->
        <p [innerHTML]="message"></p>

        <div class="dialog-actions">

            <button class="btn-cancel" *ngIf="showCancel" (click)="onCancel()">
                {{ cancelText }}
            </button>

            <button class="btn-ok" (click)="onOk()" *ngIf="ShowOk">
                {{ okText }}
            </button>

        </div>

    </div>

</div>
